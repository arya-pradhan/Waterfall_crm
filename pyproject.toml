[project]
name = "outreach"
version = "0.1.0"
description = "Outreach pipeline + thin CRM: source -> waterfall enrich (via treg) -> score -> draft -> track"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
outreach = "outreach.cli:app"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
